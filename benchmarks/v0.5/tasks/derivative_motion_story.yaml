id: derivative_motion_story
version: "0.5.0"
difficulty: focused
domains:
  - calculus
  - motion
title: Derivative Motion Story
runtime_limit_seconds: 120
prompt: |
  Create a ManimCE animation explaining the derivative as instantaneous rate
  of change on a graph.

  Requirements:
  - Define exactly one primary scene class named MainScene.
  - Show a curve, a moving point, a secant line becoming a tangent line, and a
    derivative formula.
  - Include labels for secant slope, tangent slope, dx, dy, and f'(x).
  - Use a timeline or numbered stages so the progression is explicit.
  - Keep text legible and place formula blocks away from the graph.
required_labels:
  - derivative
  - secant slope
  - tangent slope
  - dx
  - dy
  - f'(x)
required_visuals:
  - curve with labeled point
  - secant to tangent transition
  - derivative formula
  - staged explanation
automated_checks:
  required_scene_class: MainScene
  forbidden_imports: [requests, socket, urllib, subprocess, pathlib.Path.home]
  min_required_labels: 5
  fps: 60
  max_duration_seconds: 120
  required_source_terms:
    - Axes
    - ValueTracker
    - always_redraw
    - Line
    - MathTex
    - Transform
rubric:
  mathematical_correctness: The secant-to-tangent story correctly motivates f'(x).
  visual_clarity: Labels and formulas remain readable throughout the animation.
  animation_quality: The transition is smooth and staged.
