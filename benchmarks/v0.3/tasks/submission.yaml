  required_source_terms:
    - Axes
    - MathTex
    - Text
    - Vector
    - Matrix
    - Polygon
rubric:
  geometry_correctness: >
    Diagrams use correct relative placement and labels do not contradict the
    geometry.
  readability: >
    Text and equations are legible at normal playback size and do not overlap.
  section_coverage: >
    All six required sections are visibly present and mathematically meaningful.
  fake_visuals: >
    The scene constructs visuals with Manim objects rather than static images or
    superficial placeholders.
  shareability: >
    The final MP4 works as a concise, public-facing benchmark submission.
