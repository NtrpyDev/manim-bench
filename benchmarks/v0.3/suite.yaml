id: manimbench-v0.3-composite
version: "0.3.0"
title: ManimBench V0.3 Composite Suite
description: >
  One-video ManimCE benchmark suite with stricter section coverage, visual
  review artifacts, usage accounting, and publishable leaderboard outputs.
runtime:
  manim: community
  fps: 60
  max_duration_seconds: 120
  scene_class: MainScene
policy:
  official_backend: container
  local_backend: development_only
  output_shape: one_final_mp4_per_model
  required_output_file: outputs/submission.py
  visual_review:
    required: true
    statuses:
      - pass
      - partial
      - fail
      - pending
  usage_tracking:
    required: true
    files:
      - usage.json
    metrics:
      - elapsed_seconds
      - input_tokens
      - output_tokens
      - total_tokens
      - estimated_usd
tasks:
  - tasks/submission.yaml
