id: medium_taylor_series_sine
version: "1.0"
difficulty: medium
domains: [calculus, approximation, graphing]
title: Taylor Series Approximation Of Sine
runtime_limit_seconds: 120
prompt: >
  Create a ManimCE animation explaining how Taylor polynomials approximate
  sin(x) near x = 0. Plot sin(x), then animate the degree 1, 3, 5, and 7 Taylor
  polynomials. Label every curve, the expansion formula, the center x = 0, and
  an error region showing where the approximation improves or worsens.
required_labels:
  - sin(x)
  - x
  - x - x^3/3!
  - degree 5
  - degree 7
  - error
  - x = 0
required_visuals:
  - axes
  - true sine curve
  - multiple Taylor polynomial curves
  - error indication
automated_checks:
  forbidden_imports: [requests, socket, urllib, subprocess, pathlib.Path.home]
  required_scene_class: MainScene
  max_duration_seconds: 120
  fps: 60
rubric:
  math_correctness: Taylor terms and approximation behavior are correct.
  visual_clarity: Curves, formula, center, and error cue are clearly labeled.
  animation_quality: Progressive polynomial updates communicate convergence near zero.
