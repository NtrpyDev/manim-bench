id: geometry_measurement_diagram
version: "0.4.0"
difficulty: focused
domains:
  - geometry
  - measurement
title: Geometry Diagram With Measurements
runtime_limit_seconds: 120
prompt: |
  Create a ManimCE geometry diagram explaining the area of a right triangle.

  Requirements:
  - Draw a right triangle with side lengths 3, 4, and 5.
  - Label the right angle, acute angle theta, side lengths, and area.
  - Shade the triangular region and display Area = 1/2 * 3 * 4 = 6.
  - Include an angle arc or Angle mobject and measurement labels outside the
    triangle where possible.
  - Avoid labels covering sides, angles, or the shaded region.
required_labels:
  - Geometry
  - 3
  - 4
  - 5
  - right angle
  - theta
  - Area = 1/2 * 3 * 4 = 6
  - region
required_visuals:
  - right triangle
  - side length labels
  - angle marker
  - shaded region
  - area equation
automated_checks:
  required_scene_class: MainScene
  forbidden_imports: [requests, socket, urllib, subprocess, pathlib.Path.home]
  min_required_labels: 6
  fps: 60
  max_duration_seconds: 120
  required_source_terms:
    - Polygon
    - Angle
    - MathTex
    - Text
    - Brace
rubric:
  mathematical_correctness: Side lengths, right angle, and area calculation are correct.
  visual_clarity: Measurements sit near their features without covering them.
  animation_quality: Construction or shading helps explain the formula.
