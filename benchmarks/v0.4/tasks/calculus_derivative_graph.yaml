id: calculus_derivative_graph
version: "0.4.0"
difficulty: focused
domains:
  - calculus
  - graphing
title: Calculus Derivative Graph
runtime_limit_seconds: 120
prompt: |
  Create a ManimCE animation explaining a derivative on a graph.

  Requirements:
  - Plot f(x) = x^3 - 3x on labeled axes.
  - Mark x = 1 and show a tangent line at that point.
  - Display and explain f'(x) = 3x^2 - 3 and f'(1) = 0.
  - Label the axes, graph, point, tangent, derivative equation, and slope.
  - Keep graph labels away from the curve and frame edges.
required_labels:
  - Calculus
  - f(x) = x^3 - 3x
  - derivative
  - tangent
  - x = 1
  - f'(x) = 3x^2 - 3
  - f'(1) = 0
  - slope
required_visuals:
  - labeled axes
  - plotted function graph
  - tangent line at x = 1
  - derivative equation
automated_checks:
  required_scene_class: MainScene
  forbidden_imports: [requests, socket, urllib, subprocess, pathlib.Path.home]
  min_required_labels: 6
  fps: 60
  max_duration_seconds: 120
  required_source_terms:
    - Axes
    - plot
    - MathTex
    - Dot
    - Line
    - Text
rubric:
  mathematical_correctness: The point, tangent, derivative, and slope agree.
  visual_clarity: Axes, graph, tangent, and labels do not collide.
  animation_quality: The derivative idea is animated rather than only stated.
