id: linear_algebra_transformation
version: "0.4.0"
difficulty: focused
domains:
  - linear_algebra
  - vectors
title: Linear Algebra Matrix Transformation
runtime_limit_seconds: 120
prompt: |
  Create a ManimCE animation showing a 2D matrix transformation.

  Requirements:
  - Show basis vectors i and j and vector v = (2, 1) on a coordinate plane.
  - Apply A = [[1, 1], [0, 2]] and show Av = (3, 2).
  - Display the matrix equation Av = (3, 2).
  - Label original and transformed vectors, basis vectors, coordinates, and the
    matrix.
  - Keep vectors, matrix text, and coordinate labels readable.
required_labels:
  - Linear algebra
  - i
  - j
  - v = (2, 1)
  - A
  - Av = (3, 2)
  - matrix
  - transformation
required_visuals:
  - coordinate plane
  - basis vectors
  - original vector
  - transformed vector
  - matrix equation
automated_checks:
  required_scene_class: MainScene
  forbidden_imports: [requests, socket, urllib, subprocess, pathlib.Path.home]
  min_required_labels: 6
  fps: 60
  max_duration_seconds: 120
  required_source_terms:
    - NumberPlane
    - Vector
    - Matrix
    - MathTex
    - Transform
    - Text
rubric:
  mathematical_correctness: The matrix action and transformed coordinates are correct.
  visual_clarity: Vectors and labels are distinguishable on the plane.
  animation_quality: The transformation is visible and not just a final diagram.
