[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manimbench"
version = "0.7.0"
description = "A sandboxed benchmark of how well AI models teach mathematics with Manim Community Edition animations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ManimBench Contributors" }
]
dependencies = [
  "PyYAML>=6.0.2",
  "numpy>=1.26",
  "opencv-python-headless>=4.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
manimbench = "manimbench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "container: renders real scenes in the sandbox image (needs Docker and the pinned image)"
]

[tool.hatch.build.targets.wheel]
packages = ["src/manimbench"]
