# The models the benchmark knows how to call.
#
# Each model lists the routes it can be reached through. On OpenRouter every
# model is pinned to one upstream provider with fallbacks off, so every sample
# from a model is served the same way. Slugs and provider tags were read from
# OpenRouter's public catalog on 2026-11-10. `manimbench models check` compares
# this file against the live catalog. Whether OpenRouter accepts these exact
# provider tags in a request is unverified until the first live call.
#
# reasoning_effort: null means "use the model's own default".
schema_version: 1
